  - text: "시험 주관 기관은 해당 응시자의 답안을 보류하고 경위를 조사한다고 밝혔다."
    sources: [s3]
  - text: "같은 고사장 응시자 일부가 시험 뒤 '문제 사진이 메신저로 돌았다'고 주장했다."
    sources: [s1, s4]

open_questions:
  - text: "안경으로 실제 문제를 밖으로 보냈는지, 기능만 있었던 것인지"
    who: "기관 조사 결과 전"
  - text: "다른 응시자에게도 같은 기기가 있었는지"
