story:
  - step: 여는 장
    title: "시험장에 안경을 쓰고 들어갔을 뿐인데, 왜 퇴실을 당했을까?"
    body: >-
      지난 토요일 ○○자격시험 2차 시험장. 감독관이 한 응시자의 안경을 들여다보다가 시험을 멈춰 세웠습니다.
      겉보기엔 평범한 뿔테였지만 안경다리에 작은 카메라와 마이크가 들어 있었다는 겁니다.

  - step: 배경
    title: "요즘 스마트안경은 사진을 찍고, 소리를 듣고, 글자를 읽어 줍니다"
    body: >-
      스마트안경은 몇 년 전만 해도 두껍고 티가 났습니다. 지금 팔리는 제품은 일반 안경과 무게가 비슷하고,
      버튼 하나로 사진을 찍어 휴대폰으로 보내거나 이어폰 없이 소리를 들려줍니다. 시험장 반입 금지 목록에는
      휴대폰·스마트워치가 있지만 안경은 '시력 교정용'이라 따로 적혀 있지 않은 경우가 많습니다.
    visual:
      kind: timeline
      items:
        - {time: "8일 09:30", text: "2차 시험 시작", sources: [s1]}
        - {time: "8일 10:50", text: "감독관이 응시자 1명 안경 확인 후 퇴실 조치", sources: [s1, s2]}
        - {time: "10일 18:00", text: "커뮤니티에 '문제 사진이 돌았다'는 글", sources: []}
        - {time: "11일 09:00", text: "주관 기관 '답안 보류·경위 조사' 발표", sources: [s3]}

  - step: 전개
    title: "시험이 끝나자 '문제가 밖으로 샜다'는 이야기가 퍼졌습니다"
    body: >-
      시험 다음 날부터 수험생 커뮤니티 세 곳에 비슷한 글이 올라왔습니다. 시험 시간 중에 문제 사진이
      메신저로 돌았다는 내용입니다. 다만 사진의 원본이나 시각을 확인한 보도는 아직 없습니다.
    visual:
      kind: reaction
      note: "커뮤니티 글 37건(사이트 3곳) · 실시간 키워드 최고 2위 · 다룬 매체 9곳 — 글 내용은 근거로 쓰지 않는다"

  - step: 첫 반전
    title: "그런데, 감독관이 안경을 의심한 건 기능 때문이 아니었습니다"
    body: >-
      감독관이 처음 이상하게 본 것은 카메라가 아니라 안경다리의 작은 불빛이었다고 합니다. 녹화 중 표시등이
      켜져 있었다는 겁니다. 표시등을 가리는 스티커가 팔리는 요즘, 다음 시험에서는 이런 '우연'도 기대하기 어렵습니다.
    sources: [s2]

  - step: 근거 수치
    title: "부정행위 적발은 늘었지만, 전자기기 적발은 손에 꼽습니다"
    body: >-
      주관 기관이 공개한 자료를 보면 최근 시험의 부정행위 적발은 꾸준히 늘었습니다. 대부분은 시험 종료 후
      답안 작성이나 신분증 문제이고, 전자기기로 적발된 경우는 소수입니다. 찾기 어려운 만큼 적게 잡히는 것일 수 있습니다.
    visual:
      kind: numbers
      items:
        - {value: "128건", label: "최근 1년 부정행위 적발(전체)", as_of: "2025년", sources: [s3]}
        - {value: "6건", label: "그중 전자기기 사용", as_of: "2025년", sources: [s3]}
        - {value: "3년", label: "부정행위자 응시 제한 기간", as_of: "현행 규정", sources: [s5]}

  - step: 비교
    title: "다른 시험은 안경을 어떻게 다룰까요?"
    body: >-
      대학 입시와 일부 해외 자격시험은 시험 전에 안경을 따로 검사하거나, 금속 탐지기로 전자 부품을 확인합니다.
      ○○자격시험은 아직 육안 확인뿐입니다.
    visual:
      kind: compare
      columns: [시험, 안경 검사, 전자기기 탐지]
      rows:
        - [○○자격시험, 육안, 없음]
        - [가상 대입시험, 착용 전 확인, 금속 탐지기]
        - [가상 해외 회계사 시험, 감독관 검사, 금속 탐지기]
      sources: [s5, s6]

  - step: 쟁점
    title: "처벌을 넘어서, 이미 치른 시험을 어떻게 할지가 남았습니다"
    visual:
      kind: claims
      items:
        - {side: 주장, who: "일부 응시자", text: "문제가 샜다면 해당 과목을 재시험해야 한다", sources: [s4]}
        - {side: 반론, who: "주관 기관", text: "유출이 확인되지 않은 상태에서 재시험은 이르다", sources: [s3]}
        - {side: 주장, who: "가상 교육단체", text: "웨어러블 기기를 반입 금지 목록에 명시해야 한다", sources: [s6]}

  - step: 닫는 장
    title: "결국 남은 질문은, 안경 하나를 시험장이 어디까지 의심할 수 있느냐입니다"
    body: >-
      시력 교정용 안경을 모두 검사하면 응시자 불편이 크고, 그대로 두면 이번 같은 일을 막기 어렵습니다.
      기관의 조사 결과와 다음 시험 공고에 반입 규정이 바뀌는지가 다음 볼거리입니다.
    visual:
      kind: next
      items:
        - {date: "11월 중", text: "주관 기관 조사 결과 발표(예정 · 날짜 미정)"}
        - {date: "12월 2일", text: "합격자 발표(공고 기준)"}
        - {date: "내년 상반기", text: "다음 회 시험 공고 — 반입 규정 변경 여부"}

