headline: "자격시험장에 '스마트안경'이 들어왔다"
dek: "○○자격시험에서 촬영·통역 기능이 있는 안경으로 문제를 빼냈다는 의심이 나왔습니다. 시험 주관 기관은 조사 중이고, 결과에 따라 합격 처리가 달라질 수 있습니다."

