# 클레임 레코드 양식 — private/desk/claims/<날짜>/<card_id>-cN.yaml (값은 전부 지어낸 예시 · 규칙 정본 docs/methodology.md §2~§4)
claim_id: 2026-01-02-am-01-c1
card_id: 2026-01-02-am-01
text: "지어낸 주장 문장(무엇이·언제·얼마)"
observed: "12.3%"                  # 원문에 적힌 표기 그대로 — 사람이 눈으로 대조할 문자열. 기계 대조(verification)를 쓰는 기록은 문장(마침표까지)·줄·표의 칸을 통째로 따온다(문장 중간에서 끊지 않는다)
source:
  url: "https://example.org/stat"
  tier: T1
  publisher: "가상 통계청"
  accessed: "2026-01-02"
  archived: ""                     # Wayback 주소(발행 전에 채운다)
cross_check: []                    # [{url, tier, publisher, same_origin_as_source}]
status: pending                    # 사람 대조 전에는 항상 pending
checks:
  unit_ok: true
  base_period: "2025-12"
  real_vs_nominal: nominal         # 금액 지표가 아니면 n/a
  seasonally_adjusted: n/a
  methodology_match: true          # 나라·기관 간 비교가 아니면 n/a
  revision_status: preliminary     # preliminary | final | n/a
  primary_doc_locator: "보도자료 첫 문단 / 표 1"
  recalculated: false              # 원자료에서 다시 계산했는가
  translation_checked: true
counter:
  core_claim: "이 수치로 하려는 말"
  strongest_counter: "가장 강한 반례"
  denominator_check: "분모·비교군은 무엇인가"
  residual_uncertainty: "남는 불확실성"
verifiers:
  claude: "원문을 열어 첫 문단에서 값 확인(2026-01-02)"
  subagent: ""                     # 독립 검증 결과: 일치 | 불일치 | 열지 못함
  gemini: ""
  chatgpt: ""
human_verified: false
# verification:                    # 새로 쓰는 기록에만(옛 기록에 칸을 더하면 승인 지문이 바뀐다). capture 명령이 capture·match·image 를 채운다
#   method: machine
#   capture: {url, final_url, fetched_at, sha256, path, kind, text_path}
#   match: {found, count, offsets, context}
#   image: {path, reason}             # 미리 보기일 뿐이다. 덱은 이 그림을 쓰지 않고, 빌드할 때 해시가 확인된 사본의 대조한 자리에서 새로 그린다
#   author: {by: "쓴 쪽 식별자", located: ""}      # observed 가 사본에 여러 번 나오면 어느 자리인지 가리키는 대목(이것도 문장·줄·칸 통째 — 앞뒤 문장까지 넓힌다)
#   recheck: {by: "재대조한 쪽 식별자", located: "사본에서 스스로 찾은 대목(문장·줄·칸 통째)", checks: {unit, as_of, status: 확정|잠정|전망|주장, population, speaker}, at}
#   verified_at: ""                # machine-verify 가 채운다 → status verified · 표시 「원문 일치」(human_verified 는 false 그대로)
links: {video_id: "", time_range: "", slide_id: ""}
