[project]
name = "ozl"
version = "0.1.0"
description = "OZL — 오늘의 즐길거리: 뉴스에서 방송 소재를 골라 숫자를 원문과 맞춰 보는 작업 기록"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp",
  "python-pptx>=1.0.2",
  "matplotlib>=3.8",
  "pyyaml",
  "feedparser",
  "trafilatura",
  "imagehash",
  "scenedetect",
  "opencv-python-headless",
  "savepagenow",
  "notion-client",
  "requests",
  "kiwipiepy",
  "mkdocs-material",
]

[project.optional-dependencies]
ml = ["bertopic", "FlagEmbedding", "sentence-transformers"]
dev = ["pytest", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
