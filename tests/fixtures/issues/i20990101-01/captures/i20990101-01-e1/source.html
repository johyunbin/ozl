<!doctype html><html><head><meta charset='utf-8'><title>시내버스 요금 조정 안내</title></head><body><h1>시내버스 요금 조정 안내</h1><p>한빛시는 2099년 1월부터 시내버스 기본요금을 400원 올린다. 시는 운송 적자와 연료비 상승을 요금 조정의 근거로 들었다. 설명 자료에 실린 운송 적자 수치는 2095년 결산 기준이다.</p><p>요금 조정안은 2월 시의회에 올라간다.</p><p>이 문서는 시험용으로 지어낸 가상의 자료이며 실제 기관이나 회사와 관계가 없다. 문장과 수치는 모두 지어낸 것이다.</p></body></html>
