# 묶기 정답 60쌍(설계 문서 §9-2). 제목·이름·회사·지명은 전부 지어낸 것이다.
# 정답(same_issue, event_a/event_b)은 코드를 짜기 전에 적었고, 코드 결과에 맞추려고 바꾸지 않는다.
# 지지 기사(support)는 그 쪽 기사와 가상 이름 둘 이상(또는 하나와 제목 유사도 0.55 이상)을 공유하게 쓴다(그 쪽을 이슈로 만드는 것이 목적).
# 쌍: id, kind, names(가상 고유명사 — analyze() 가 entity 로 내는지 시험이 먼저 단언), a·b(title, outlet, published[KST], summary 선택), support(각 쪽을 이슈로 만드는 다른 매체 기사, for: a|b),
#     event_a·event_b(정답 사건 라벨), same_issue, 전재는 same_copy_group, why(까닭 한 줄).
# 가상의 2주: 2030-03-01 ~ 2030-03-14.

