<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OZL 이슈 브리핑</title>
<style>
:root {
  --bg: #f6f5f1; --paper: #ffffff; --text: #1b1b19; --muted: #6d6c66; --line: #e6e4de; --soft: #f0eee8;
  --accent: #d9480f; --accent-soft: #fff1e8; --fact: #1c7ed6; --fact-soft: #e7f2fd; --open: #a15c00; --open-soft: #fff6e0;
  --pro: #2b8a3e; --pro-soft: #e9f7ec; --con: #c92a2a; --con-soft: #fdecec; --example: #6741d9; --example-soft: #f1ecff;
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --paper: #1c1c1a; --text: #ecebe6; --muted: #9c9b94; --line: #2e2e2b; --soft: #242421;
    --accent: #ff8a4c; --accent-soft: #3a2416; --fact: #74c0fc; --fact-soft: #14263a; --open: #ffc078; --open-soft: #33270f;
    --pro: #69db7c; --pro-soft: #13301a; --con: #ff8787; --con-soft: #3a1a1a; --example: #b197fc; --example-soft: #261d3d;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16.5px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere; }
.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 5; transition: width .1s linear; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
header.top { padding: max(18px, env(safe-area-inset-top)) 0 0; }
.example { display: inline-block; font-size: 12px; font-weight: 600; color: var(--example); background: var(--example-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; }
.kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
h1 { font-family: var(--serif); font-size: clamp(27px, 7vw, 36px); line-height: 1.3; letter-spacing: -0.02em; margin: 10px 0 12px; }
.dek { font-size: 17px; color: var(--muted); margin: 0 0 18px; }
.why { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
.why div { background: var(--paper); padding: 10px 8px; text-align: center; }
.why b { display: block; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.why span { font-size: 11.5px; color: var(--muted); line-height: 1.3; display: block; margin-top: 2px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 14px; margin-bottom: 14px; }
.card h2 { font-size: 13px; letter-spacing: .02em; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.card.facts h2 { color: var(--fact); } .card.open h2 { color: var(--open); }
.card ol, .card ul { margin: 0; padding: 0; list-style: none; }
.card li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.card li:first-child { border-top: 0; padding-top: 2px; }
.num { width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; display: grid; place-items: center; margin-top: 4px; }
.facts .num { background: var(--fact-soft); color: var(--fact); }
.open .num { background: var(--open-soft); color: var(--open); }
.who { display: block; font-size: 13px; color: var(--muted); }
.src { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 2px; vertical-align: 1px; }
.src a, .src span { font-size: 11.5px; line-height: 1.6; padding: 0 7px; border-radius: 6px; background: var(--soft); color: var(--muted); text-decoration: none; white-space: nowrap; }
.src a.official { background: var(--fact-soft); color: var(--fact); }
.src .none { font-style: italic; }
.mode { position: sticky; top: 3px; z-index: 4; display: flex; justify-content: center; padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin: 18px -16px 4px; }
.block { scroll-margin-top: 64px; }
.mode div { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; border: 1px solid var(--line); }
.mode button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--paper); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.story { position: relative; padding-left: 26px; margin-top: 6px; }
.story::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.block { position: relative; padding: 4px 0 26px; }
.block::before { content: ""; position: absolute; left: -24px; top: 11px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); border: 2px solid var(--muted); }
.block.twist::before { border-color: var(--accent); background: var(--accent); }
.block.twist { background: var(--accent-soft); margin: 0 -12px 14px -12px; padding: 12px 12px 14px; border-radius: 14px; }
.block.twist::before { left: -12px; top: 23px; }
.headlines-only .block.twist { padding: 10px 12px; }
.step { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.twist .step { color: var(--accent); }
.block h3 { font-family: var(--serif); font-size: 21px; line-height: 1.45; margin: 2px 0 8px; letter-spacing: -0.01em; }
.block p { margin: 0 0 12px; }
.headlines-only .block p, .headlines-only .viz, .headlines-only .block .src { display: none; }
.headlines-only .block { padding-bottom: 14px; }
.headlines-only .block h3 { font-size: 18px; margin-bottom: 0; }
.viz { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px; margin: 4px 0 8px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14.5px; line-height: 1.55; }
.tl li:first-child { border-top: 0; }
.tl time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meters { display: grid; gap: 10px; }
.meter { display: grid; grid-template-columns: 92px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.meter .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter b { text-align: right; font-variant-numeric: tabular-nums; }
.viz .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.nums span { font-size: 12.5px !important; }
.nums div { border-radius: 12px; background: var(--soft); padding: 10px; }
.nums b { display: block; font-size: clamp(21px, 6vw, 28px); line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.nums span { display: block; font-size: 13px; line-height: 1.4; margin-top: 4px; }
.nums small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
tr.focus td { font-weight: 600; background: var(--accent-soft); }
.claims { display: grid; gap: 8px; }
.claim { border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.55; }
.claim.pro { background: var(--pro-soft); } .claim.con { background: var(--con-soft); }
.claim .side { font-size: 11.5px; font-weight: 700; display: block; }
.claim.pro .side { color: var(--pro); } .claim.con .side { color: var(--con); }
.claim .by { font-size: 12.5px; color: var(--muted); }
.next { list-style: none; margin: 0; padding: 0; }
.next li { display: grid; grid-template-columns: 22px 92px 1fr; gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14.5px; line-height: 1.5; }
.next li:first-child { border-top: 0; }
.next li::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--muted); border-radius: 4px; margin-top: 4px; }
.next time { font-size: 12.5px; color: var(--muted); }
footer { margin: 18px 0 60px; font-size: 13.5px; color: var(--muted); }
footer h2 { font-size: 13px; color: var(--text); margin: 18px 0 6px; }
footer ol { margin: 0; padding-left: 20px; }
footer li { margin: 3px 0; }
footer a { color: inherit; text-underline-offset: 2px; }
.badge-off { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--fact-soft); color: var(--fact); margin-left: 4px; }
.err { padding: 40px 0; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<main class="wrap" id="root"><p class="err">불러오는 중…</p></main>
<script>
"use strict";
const $ = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const safe = u => { try { const x = new URL(u); return ["http:", "https:"].includes(x.protocol) ? x.href : null; } catch (_) { return null; } };
const ts = s => new Date(String(s).replace(/(\.\d{3})\d+/, "$1"));
const short = s => { const d = ts(s); return isFinite(d) ? `${d.getDate()}일 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "—"; };
const fmt = s => { const d = ts(s); return isFinite(d) ? d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; };

function srcChips(ids, byId) {
  const box = $("span", { class: "src" });
  if (!ids || !ids.length) { box.append($("span", { class: "none" }, "출처 없음 · 단서")); return box; }
  for (const id of ids) {
    const s = byId[id]; if (!s) continue;
    const u = safe(s.url);
    box.append(u ? $("a", { href: u, target: "_blank", rel: "noopener noreferrer", class: s.kind === "official" ? "official" : "" }, s.outlet)
                 : $("span", {}, s.outlet));
  }
  return box;
}

function readMinutes(b) {   // 한글 본문 분당 500자 + 도식 하나당 15초
  let chars = (b.headline + b.dek).length;
  for (const f of b.facts) chars += f.text.length;
  for (const q of b.open_questions) chars += q.text.length;
  let viz = 0;
  for (const s of b.story) { chars += (s.title || "").length + (s.body || "").length; if (s.visual) viz++; }
  return Math.max(1, Math.round(chars / 500 + viz * 0.25));
}

function viz(v, b, byId) {
  const box = $("div", { class: "viz" });
  if (v.kind === "timeline") {
    const ul = $("ul", { class: "tl" });
    for (const it of v.items) ul.append($("li", {}, $("time", {}, it.time), $("div", {}, it.text, " ", srcChips(it.sources, byId))));
    box.append(ul);
  } else if (v.kind === "reaction") {
    const w = b.why_now || {};
    const rows = [["커뮤니티 글", w.community_posts, 50, `${w.community_posts}건`], ["커뮤니티 수", w.community_sites, 5, `${w.community_sites}곳`],
                  ["다룬 매체", w.outlets, 15, `${w.outlets}곳`], ["실시간 순위", w.search_rank ? 11 - Math.min(w.search_rank, 10) : 0, 10, w.search_rank ? `${w.search_rank}위` : "—"]];
    const m = $("div", { class: "meters" });
    for (const [label, val, max, txt] of rows) {
      const bar = $("div", { class: "bar" }, $("i", {}));
      bar.firstChild.style.width = `${Math.min(100, Math.round((val || 0) / max * 100))}%`;
      m.append($("div", { class: "meter" }, $("span", {}, label), bar, $("b", {}, txt)));
    }
    box.append(m);
    if (v.note) box.append($("p", { class: "note" }, v.note));
  } else if (v.kind === "numbers") {
    const g = $("div", { class: "nums" });
    for (const it of v.items) g.append($("div", {}, $("b", {}, it.value), $("span", {}, it.label), $("small", {}, it.as_of, " ", srcChips(it.sources, byId))));
    box.append(g);
  } else if (v.kind === "compare") {
    const t = $("table"), head = $("tr");
    for (const c of v.columns) head.append($("th", {}, c));
    t.append(head);
    v.rows.forEach((r, i) => { const tr = $("tr", { class: i === 0 ? "focus" : "" }); for (const c of r) tr.append($("td", {}, c)); t.append(tr); });
    box.append(t);
    if (v.sources) box.append($("p", { class: "note" }, "출처 ", srcChips(v.sources, byId)));
  } else if (v.kind === "claims") {
    const g = $("div", { class: "claims" });
    for (const it of v.items) g.append($("div", { class: "claim " + (it.side === "반론" ? "con" : "pro") },
      $("span", { class: "side" }, it.side), it.text, $("div", { class: "by" }, it.who, " ", srcChips(it.sources, byId))));
    box.append(g);
  } else if (v.kind === "next") {
    const ul = $("ul", { class: "next" });
    for (const it of v.items) ul.append($("li", {}, $("time", {}, it.date), $("span", {}, it.text)));
    box.append(ul);
  }
  return box;
}

function render(b) {
  const byId = Object.fromEntries((b.sources || []).map(s => [s.id, s]));
  const root = document.getElementById("root"); root.replaceChildren();
  document.title = b.headline + " · OZL 이슈 브리핑";
  const mins = readMinutes(b);
  const w = b.why_now || {};

  const top = $("header", { class: "top" });
  if (b.example) top.append($("span", { class: "example" }, "시안 · 지어낸 예시입니다"));
  top.append($("div", { class: "kicker" }, $("span", { class: "pill" }, b.status), b.category, " · ", `${fmt(b.updated_at)} 업데이트`, " · ", `${mins}분`));
  top.append($("h1", {}, b.headline), $("p", { class: "dek" }, b.dek));
  top.append($("div", { class: "why" },
    $("div", {}, $("b", {}, w.community_posts ?? "—"), $("span", {}, "커뮤니티 글")),
    $("div", {}, $("b", {}, w.search_rank ? `${w.search_rank}위` : "—"), $("span", {}, "실시간 키워드")),
    $("div", {}, $("b", {}, w.outlets ?? "—"), $("span", {}, "다룬 매체")),
    $("div", {}, $("b", {}, w.first_seen ? short(w.first_seen) : "—"), $("span", {}, "처음 잡힌 때"))));
  root.append(top);

  const facts = $("ol");
  b.facts.forEach((f, i) => facts.append($("li", {}, $("span", { class: "num" }, i + 1), $("div", {}, f.text, " ", srcChips(f.sources, byId)))));
  root.append($("section", { class: "card facts" }, $("h2", {}, "확인된 사실"), facts));

  const open = $("ul");
  b.open_questions.forEach(q => open.append($("li", {}, $("span", { class: "num" }, "?"), $("div", {}, q.text, $("span", { class: "who" }, q.who)))));
  root.append($("section", { class: "card open" }, $("h2", {}, "아직 모르는 것"), open));

  const bHead = $("button", { "aria-pressed": "false" }, "제목만 · 30초");
  const bFull = $("button", { "aria-pressed": "true" }, `전체 · ${mins}분`);
  const mode = $("div", { class: "mode" }, $("div", {}, bHead, bFull));
  const story = $("section", { class: "story" });
  const setMode = h => { story.classList.toggle("headlines-only", h); bHead.setAttribute("aria-pressed", String(h)); bFull.setAttribute("aria-pressed", String(!h)); try { localStorage.setItem("brief-mode", h ? "h" : "f"); } catch (_) {} };
  bHead.addEventListener("click", () => setMode(true));
  bFull.addEventListener("click", () => setMode(false));
  root.append(mode, story);

  for (const s of b.story) {
    const blk = $("article", { class: "block" + (/반전/.test(s.step) ? " twist" : "") }, $("div", { class: "step" }, s.step), $("h3", {}, s.title));
    if (s.body) blk.append($("p", {}, s.body, s.sources ? " " : "", s.sources ? srcChips(s.sources, byId) : null));
    if (s.visual) blk.append(viz(s.visual, b, byId));
    story.append(blk);
  }
  try { if (localStorage.getItem("brief-mode") === "h") setMode(true); } catch (_) {}

  const f = $("footer");
  const ol = $("ol");
  for (const s of b.sources || []) {
    const u = safe(s.url);
    ol.append($("li", {}, `${s.outlet} — `, u ? $("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, s.title) : s.title,
      s.kind === "official" ? $("span", { class: "badge-off" }, "공식") : null, ` · ${fmt(s.opened_at)} 열어 봄`));
  }
  f.append($("h2", {}, "출처"), ol);
  if ((b.community_refs || []).length) {
    const cl = $("ol");
    for (const c of b.community_refs) { const u = safe(c.url); cl.append($("li", {}, `${c.site} — `, u ? $("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, c.title) : c.title, ` · 관련 글 ${c.posts}건`)); }
    f.append($("h2", {}, "이슈를 찾은 단서(커뮤니티)"), cl, $("p", {}, "커뮤니티 글은 이슈를 찾는 데만 썼고, 사실의 근거로 쓰지 않았습니다."));
  }
  f.append($("p", {}, "자동으로 모은 신호를 바탕으로 모델이 초안을 쓰고, 다른 에이전트가 출처를 다시 열어 대조했습니다."));
  root.append(f);
}

const bar = document.getElementById("progress");
addEventListener("scroll", () => {
  const h = document.documentElement; const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
  bar.style.width = `${Math.round(p * 100)}%`;
}, { passive: true });

const id = new URLSearchParams(location.search).get("id") || "sample";
fetch(`/api/brief/${encodeURIComponent(id)}`, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => { document.getElementById("root").replaceChildren($("p", { class: "err" }, `기사를 불러오지 못했습니다(${e.message})`)); });
</script>
</body>
</html>
