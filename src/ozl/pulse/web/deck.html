<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OZL 이슈 브리핑</title>
<style>
:root {
  --bg: #f6f5f1; --paper: #ffffff; --text: #1b1b19; --muted: #6d6c66; --line: #e3e1da; --soft: #efede7;
  --accent: #d9480f; --accent-soft: #fff0e6;
  --v1: #2b8a3e; --v1s: #e6f6ea; --v2: #b7791f; --v2s: #fdf3dc; --v3: #c92a2a; --v3s: #fde8e8; --v4: #5f5e5a; --v4s: #ecebe6; --v5: #1c7ed6; --v5s: #e5f1fc;
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --paper: #1b1b19; --text: #eceae4; --muted: #9b9a93; --line: #2d2d2a; --soft: #232320;
    --accent: #ff8a4c; --accent-soft: #33200f;
    --v1: #69db7c; --v1s: #15301b; --v2: #ffc94d; --v2s: #33290f; --v3: #ff8787; --v3s: #3a1818; --v4: #b4b2a9; --v4s: #2a2a27; --v5: #74c0fc; --v5s: #132a40;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
.bars-top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; gap: 4px; z-index: 5; }
.bars-top i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.bars-top i.on { background: var(--text); }
.topmeta { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 10px); left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); z-index: 5; }
.deck { height: 100%; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: start; display: flex; justify-content: center; overflow-y: auto; }
.inner { width: 100%; max-width: 520px; padding: calc(max(10px, env(safe-area-inset-top)) + 44px) 22px calc(env(safe-area-inset-bottom) + 84px); display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 100%; }
.step { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.twist .step { color: var(--accent); }
.slide.twist { background: var(--accent-soft); }
h1, h2 { font-family: var(--serif); letter-spacing: -0.02em; margin: 0; }
h1 { font-size: clamp(28px, 8vw, 38px); line-height: 1.28; }
h2 { font-size: clamp(24px, 6.8vw, 31px); line-height: 1.35; }
.example { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--v5); background: var(--v5s); padding: 3px 10px; border-radius: 999px; }
.kick { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.sum { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.sum li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 16px; line-height: 1.55; }
.sum li b { font-size: 13px; color: var(--muted); margin-top: 2px; }
.vbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.vlegend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.vlegend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: 0; }
.big { font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big small { font-size: .32em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.cap { font-size: 15px; color: var(--muted); }
.claim { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; position: relative; }
.claim .who { font-size: 12.5px; color: var(--muted); }
.claim q { display: block; font-size: 19px; line-height: 1.5; margin-top: 6px; quotes: "“" "”"; }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 800; padding: 8px 16px; border-radius: 12px; border: 3px solid var(--c); color: var(--c); background: var(--cs); transform: rotate(-3deg); align-self: flex-start; letter-spacing: -0.01em; }
.why { font-size: 16px; line-height: 1.6; }
.barlist { display: grid; gap: 12px; }
.br { display: grid; grid-template-columns: 88px 1fr 52px; gap: 10px; align-items: center; font-size: 14px; }
.br .t { height: 14px; background: var(--soft); border-radius: 7px; overflow: hidden; }
.br .t i { display: block; height: 100%; background: var(--muted); border-radius: 7px; }
.br.hi .t i { background: var(--accent); } .br.hi { font-weight: 700; }
.br b { text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.cards div { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.cards b { display: block; font-size: 34px; line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.cards span { display: block; font-size: 13.5px; line-height: 1.45; margin-top: 6px; }
.qs { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.qs li { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 17px; line-height: 1.45; display: flex; gap: 10px; }
.qs li::before { content: "?"; font-weight: 800; color: var(--accent); }
.body { font-size: 17px; line-height: 1.7; margin: 0; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px); display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 6; background: linear-gradient(transparent, var(--bg) 40%); }
.dock button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--text); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.dock .nav { display: flex; gap: 8px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 70%; overflow-y: auto; background: var(--paper); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 20px calc(env(safe-area-inset-bottom) + 20px); z-index: 8; transform: translateY(105%); transition: transform .22s ease; }
.sheet.open { transform: none; }
.sheet h3 { margin: 0 0 10px; font-size: 15px; }
.sheet ol { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.6; }
.sheet li { margin-bottom: 8px; }
.sheet a { color: inherit; text-underline-offset: 2px; }
.sheet .k { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--v5s); color: var(--v5); margin-left: 4px; }
.sheet p { font-size: 13px; color: var(--muted); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 7; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.err { margin: auto; color: var(--muted); }
</style>
</head>
<body>
<div class="bars-top" id="bars"></div>
<div class="deck" id="deck"><p class="err">불러오는 중…</p></div>
<div class="dock">
  <button id="srcBtn">근거 보기</button>
  <div class="nav"><button id="prev" aria-label="이전 장">이전</button><button id="next" aria-label="다음 장">다음</button></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-live="polite"></aside>
<script>
"use strict";
const VERDICTS = [["확인", "v1"], ["일부 맞음", "v2"], ["사실과 다름", "v3"], ["근거 없음", "v4"], ["확인 못 함", "v5"]];
const VC = Object.fromEntries(VERDICTS);
const $ = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") n.className = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v); }
  for (const k of kids) if (k != null && k !== false) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
};
const safe = u => { try { const x = new URL(u); return ["http:", "https:"].includes(x.protocol) ? x.href : null; } catch (_) { return null; } };
const ts = s => new Date(String(s).replace(/(\.\d{3})\d+/, "$1"));
const fmt = s => { const d = ts(s); return isFinite(d) ? d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; };
const vcolor = v => { const k = VC[v] || "v5"; return `--c: var(--${k}); --cs: var(--${k}s)`; };

let deck, slides = [], idx = 0, data;

function verdictBar(claims) {
  const counts = VERDICTS.map(([v]) => [v, claims.filter(c => c.verdict === v).length]).filter(([, n]) => n);
  const bar = $("div", { class: "vbar", role: "img", "aria-label": counts.map(([v, n]) => `${v} ${n}`).join(", ") });
  for (const [v, n] of counts) bar.append($("i", { style: `flex:${n}; background: var(--${VC[v]})` }));
  const leg = $("div", { class: "vlegend" });
  for (const [v, n] of counts) leg.append($("span", { style: `--c: var(--${VC[v]})` }, `${v} ${n}`));
  return [bar, leg];
}

function slideEl(s, b) {
  const sec = $("section", { class: "slide" + (s.twist ? " twist" : "") });
  const inner = $("div", { class: "inner" });
  sec.append(inner);
  if (s.type === "cover") {
    const claims = b.slides.filter(x => x.type === "claim");
    if (b.example) inner.append($("span", { class: "example" }, "형식 예시 · 지어낸 내용"));
    inner.append($("div", { class: "kick" }, $("span", { class: "pill" }, b.status), b.category, " · ", `${fmt(b.updated_at)}`));
    inner.append($("h1", {}, b.headline));
    const ul = $("ol", { class: "sum" });
    (b.summary || []).forEach((t, i) => ul.append($("li", {}, $("b", {}, i + 1), $("span", {}, t))));
    inner.append(ul);
    if (claims.length) {
      inner.append($("div", { class: "step" }, `떠도는 주장 ${claims.length}개를 확인해 보니`), ...verdictBar(claims));
    }
    inner.append($("div", { class: "note" }, `옆으로 넘기면 ${b.slides.length - 1}장 · 한 장에 한 문장`));
    return sec;
  }
  if (s.step) inner.append($("div", { class: "step" }, s.step));
  if (s.title) inner.append($("h2", {}, s.title));
  if (s.type === "number") {
    const big = $("div", { class: "big" }, s.big, s.unit ? $("small", {}, s.unit) : null);
    const chars = String(s.big).length + String(s.unit || "").length * 0.32;   // 단위는 작게 그린다
    big.style.fontSize = `min(128px, calc((min(100vw, 520px) - 44px) / ${Math.max(2.5, chars * 0.6)}))`;   // 한 줄에 들어가게
    inner.append(big);
    if (s.caption) inner.append($("div", { class: "cap" }, s.caption));
  } else if (s.type === "claim") {
    inner.append($("div", { class: "claim" }, $("span", { class: "who" }, s.said_by || "커뮤니티"), $("q", {}, s.claim)));
    inner.append($("div", { class: "stamp", style: vcolor(s.verdict) }, s.verdict));
    if (s.why) inner.append($("p", { class: "why" }, s.why));
  } else if (s.type === "bars") {
    const list = $("div", { class: "barlist" });
    for (const it of s.items) {
      const t = $("div", { class: "t" }, $("i", {}));
      t.firstChild.style.width = `${Math.max(2, Math.min(100, Math.round(it.value / (it.max || 100) * 100)))}%`;
      list.append($("div", { class: "br" + (it.label === s.highlight ? " hi" : "") }, $("span", {}, it.label), t, $("b", {}, it.display || it.value)));
    }
    inner.append(list);
    if (s.note) inner.append($("div", { class: "note" }, s.note));
  } else if (s.type === "cards") {
    const g = $("div", { class: "cards" });
    for (const it of s.items) g.append($("div", {}, $("b", {}, it.value), $("span", {}, it.label)));
    inner.append(g);
    if (s.note) inner.append($("div", { class: "note" }, s.note));
  } else if (s.type === "text") {
    inner.append($("p", { class: "body" }, s.body));
  } else if (s.type === "questions") {
    const ul = $("ul", { class: "qs" });
    for (const q of s.items) ul.append($("li", {}, q));
    inner.append(ul);
  }
  return sec;
}

function sourcesFor(i) {
  const s = slides[i], byId = Object.fromEntries((data.sources || []).map(x => [x.id, x]));
  let ids = s.sources || [];
  if (s.type === "cover" || s.type === "questions") ids = (data.sources || []).map(x => x.id);
  const items = [...new Set(ids)].map(id => byId[id]).filter(Boolean);
  return items;
}

function openSheet() {
  const sh = document.getElementById("sheet"); sh.replaceChildren();
  const items = sourcesFor(idx);
  sh.append($("h3", {}, idx === 0 || slides[idx].type === "questions" ? "이 브리핑의 근거 전체" : "이 장의 근거"));
  if (!items.length) sh.append($("p", {}, "이 장은 앞뒤 장의 근거를 잇는 연결 장입니다."));
  else {
    const ol = $("ol");
    for (const s of items) {
      const u = safe(s.url);
      ol.append($("li", {}, `${s.outlet} — `, u ? $("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, s.title) : s.title,
        s.kind === "official" ? $("span", { class: "k" }, "공식") : null, $("br"), $("small", {}, `${fmt(s.opened_at)} 열어 봄`)));
    }
    sh.append(ol);
  }
  if ((data.community_refs || []).length && (idx === 0 || slides[idx].type === "claim")) {
    sh.append($("h3", { style: "margin-top:16px" }, "이슈를 찾은 단서(커뮤니티)"));
    const cl = $("ol");
    for (const c of data.community_refs) { const u = safe(c.url); cl.append($("li", {}, `${c.site} — `, u ? $("a", { href: u, target: "_blank", rel: "noopener noreferrer" }, c.title) : c.title)); }
    sh.append(cl, $("p", {}, "커뮤니티 글은 이슈를 찾는 데만 썼고, 판정의 근거로 쓰지 않았습니다."));
  }
  sh.classList.add("open"); document.getElementById("scrim").classList.add("open");
}
function closeSheet() { document.getElementById("sheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }

function go(i) { idx = Math.max(0, Math.min(slides.length - 1, i)); deck.scrollTo({ left: idx * deck.clientWidth, behavior: "smooth" }); mark(); }
function mark() {
  const bars = document.getElementById("bars").children;
  for (let k = 0; k < bars.length; k++) bars[k].classList.toggle("on", k <= idx);
  document.getElementById("prev").style.visibility = idx === 0 ? "hidden" : "visible";
  document.getElementById("next").textContent = idx === slides.length - 1 ? "처음으로" : "다음";
  try { history.replaceState(null, "", `${location.pathname}${location.search.replace(/[&?]s=\d+/, "")}${location.search ? "&" : "?"}s=${idx}`); } catch (_) {}
}

function render(b) {
  data = b; slides = b.slides; deck = document.getElementById("deck"); deck.replaceChildren();
  document.title = b.headline + " · OZL 이슈 브리핑";
  for (const s of slides) deck.append(slideEl(s, b));
  const bars = document.getElementById("bars"); bars.replaceChildren(...slides.map(() => $("i")));
  deck.addEventListener("scroll", () => { const i = Math.round(deck.scrollLeft / deck.clientWidth); if (i !== idx) { idx = i; mark(); } }, { passive: true });
  const start = Number(new URLSearchParams(location.search).get("s") || 0);
  idx = isFinite(start) ? Math.min(start, slides.length - 1) : 0;
  deck.scrollLeft = idx * deck.clientWidth; mark();
}

document.getElementById("prev").addEventListener("click", () => go(idx - 1));
document.getElementById("next").addEventListener("click", () => go(idx === slides.length - 1 ? 0 : idx + 1));
document.getElementById("srcBtn").addEventListener("click", openSheet);
document.getElementById("scrim").addEventListener("click", closeSheet);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(idx + 1); else if (e.key === "ArrowLeft") go(idx - 1); else if (e.key === "Escape") closeSheet(); });
addEventListener("resize", () => { if (deck) deck.scrollLeft = idx * deck.clientWidth; });

const id = new URLSearchParams(location.search).get("id") || "deck-sample";
fetch(`/api/brief/${encodeURIComponent(id)}`, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => { document.getElementById("deck").replaceChildren($("p", { class: "err" }, `브리핑을 불러오지 못했습니다(${e.message})`)); });
</script>
</body>
</html>
