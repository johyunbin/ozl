# 출처와 약관 대장 — 수집 코드는 이 파일을 읽어 collect 가 허용이 아닌 출처에는 요청을 보내지 않는다.
# 판정은 허용, 금지, 불명 셋이고 불명은 금지처럼 다룬다. 다만 맨 위 policy(운영 판단)가 연 쓰임은 불명이어도 쓴다.
# 04:10 KST: 구글 급상승 RSS 세 줄을 원문 재확인 결과에 따라 고침(공식 내보내기 기능, robots 허용, 도움말의 재사용 허용).
# 확인일: 2026-11-14 (03:16~03:25 KST 에 robots.txt, 약관, 안내 쪽을 직접 열어 확인. clien_park 만 2026-11-11 확인분).
# 03:4x KST 재대조: 다른 모델의 원문 재대조에서 어긋난 줄(hn_front, korea_kr_sitemap_html, open_assembly_api, opendart_api, youtube_*, trends_kr, clien_park)을 원문을 다시 열어 고침.
# 칸: collect 수집 / score_use 점수에 쓰기 / store 보관 / publish 공개 화면에 원값이나 제목을 싣기 / commercial 수익에 쓰기
#     backup 비공개 원격 백업 / agent_read 이슈를 만들 때 에이전트가 기사 본문을 열어 읽기(robots 의 AI 에이전트 항목 기준).
# 해당 없는 칸은 적지 않는다(불명과 다르다). 조건은 basis 에 적는다.
# verified: 직접(원문을 직접 열어 봄) | 2차(2차 자료만) | 못 봄
# 사람이 읽는 대장: private/out/출처_약관_대장_20261114.md
checked: "2026-11-14"
# 운영 판단 — 원문에서 허락도 금지도 찾지 못해 '불명'으로 남은 쓰임 가운데 운영자가 쓰기로 정한 것.
# 아래 sources 의 줄은 원문에서 확인한 것만 적고, 이 묶음 때문에 고치지 않는다. 이 묶음을 지우거나 enabled 를 false 로 두면
# 줄의 값(불명)대로 막힌다. '금지'는 여기서 풀 수 없고, 수집·공개·수익도 여기서 열 수 없다(코드가 막는다).
policy:
  rss_counting:
    enabled: true
    scope: feeds             # feeds.yaml 의 feeds 에 있는 피드에만 닿는다
    when: {collect: 허용}     # 수집이 허용으로 확인된 피드에만
    uses: [score_use, store, backup]
    decided: "2026-11-14 04:10 KST. 계획 5-1절(언론사 RSS 는 쓴다)의 결정을 따랐다"
    note: "언론사와 기관이 공식으로 내놓은 RSS 의 제목, 요약, 링크를 받아 건수를 세고 비공개로 보관한다. 공개 화면에는 매체 이름과 링크만 싣는다. 명시 허락을 확인한 것은 아니다(금지 조항도 찾지 못했다). 수익을 내기 전에는 commercial 이 금지인 매체를 따로 정리해야 한다. 사용자가 끌 수 있다."
