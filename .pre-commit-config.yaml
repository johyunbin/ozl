repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: publish-gate
        name: 공개본 추출 게이트(노트·숨김 슬라이드·전사 인용 검사)
        entry: python3 scripts/publish_gate.py
        language: system
        files: '^(tracks/syuka/decks/.*\.pptx|daily/.*\.md|docs/.*\.md)$'
        pass_filenames: true
