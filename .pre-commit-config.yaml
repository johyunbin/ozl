repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged)
        entry: bash -c 'command -v gitleaks >/dev/null && timeout 120 gitleaks git --staged --redact --no-banner || echo "gitleaks 미설치 — 건너뜀"'
        language: system
        pass_filenames: false
      - id: publish-gate
        name: 공개본 추출 게이트(노트·숨김 슬라이드·전사 인용 검사)
        entry: .venv/bin/python scripts/publish_gate.py
        language: system
        files: '^(tracks/syuka/decks/.*\.pptx|(daily|docs|tracks|claims|skills|\.claude/skills)/.*\.(md|json|yaml|yml)|(src|tests|scripts|tools)/.*\.(py|swift|yaml|yml|sh|json|md|txt)|apps/web/(src|public|sample-data|scripts|checks)/.*\.(astro|ts|mjs|js|css|html|json|md|yaml|yml|txt)|apps/web/[^/]+\.(md|mjs|ts)|apps/ios/.*\.(swift|json|md)|README\.md|CLAUDE\.md|AGENTS\.md)$'
        pass_filenames: true
