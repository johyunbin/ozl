text: 혼다는 2026-11-09(미국 현지) 오하이오 중부에 30억 달러를 들여 연 24만 대 규모의 새 완성차 공장을 짓는다고 발표했다. 2029년 생산 시작 예정이며 정부 최종 승인이 남아 있고, 2,000명 이상을 새로 고용한다. 위치는 기존 East Liberty 공장과 Marysville 공장 사이다.
