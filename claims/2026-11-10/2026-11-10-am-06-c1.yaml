text: IMF 는 2023년 이후 공개된 AI 업계 순환 금융 거래 14건에 지분 투자 약 3,000억 달러와 부채 6,500억 달러가 들어갔고, 그 대가로 1조 4,000억 달러의 미래 매출 약정이 걸려 있다고 집계했다. 부채 6,500억 중 약 3,200억 달러는 투자받은 쪽이 졌다.
observed: Fourteen publicly disclosed transactions since 2023 account for approximately $300 billion of aggregate equity investments … supplemented by $650 billion in debt, in exchange for $1.4 trillion in future revenue commitments · About $320 billion of the $650 billion debt is taken on by investees
