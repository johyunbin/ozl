site_name: OZL — 오늘의 즐길거리
site_description: 뉴스에서 방송 소재를 골라 숫자를 원문과 맞춰 보는 작업 기록
site_url: https://johyunbin.github.io/ozl/
repo_url: https://github.com/johyunbin/ozl
theme:
  name: material
  language: ko
  features: [navigation.sections, navigation.top, search.suggest, content.tabs.link]
  palette:
    - scheme: default
      primary: deep orange
nav:
  - 홈: index.md
  - 기록: daily/
  - 작업 방식: how-it-works.md
  - 검증 방법: methodology.md
  - 쓰는 소스: sources.md
  - 도구: tooling.md
  - 정정 기록: corrections.md
markdown_extensions: [tables, admonition, toc, attr_list, pymdownx.superfences]
